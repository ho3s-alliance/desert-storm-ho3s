<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Desert Storm — Ho3s Alliance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  html,body{margin:0;padding:0;background:#0a0a0b;font-family:'Inter',sans-serif;}
  .font-display{font-family:'Cinzel',serif;}
  input,select,textarea{font-family:inherit;}
  ::placeholder{color:#6b7280;}
  .hidden{display:none !important;}
  .tab-btn{color:#6b7280;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;}
  .tab-btn.active{color:#EDE7D9;border-bottom-color:#ef4444;}
  .roster-table th{font-weight:600;}
  .roster-table td, .roster-table th{white-space:nowrap;}
</style>
</head>
<body>

<div class="min-h-screen w-full" style="background:linear-gradient(180deg,#0a0a0b 0%,#0e0d10 100%)">
  <div class="max-w-md mx-auto px-4 py-10">

    <!-- Header -->
    <div class="text-center mb-8">
      <div class="flex justify-center mb-3">
        <svg width="56" height="56" viewBox="0 0 56 56" fill="none">
          <path d="M28 8 L20 40 L28 34 L36 40 Z" stroke="#D8D2C4" stroke-width="1.4" stroke-linejoin="round" />
          <circle cx="28" cy="8" r="2.3" fill="#ef4444" />
          <circle cx="20" cy="40" r="2.1" fill="#3b82f6" />
          <circle cx="36" cy="40" r="2.1" fill="#E8B923" />
        </svg>
      </div>
      <h1 class="font-display text-3xl tracking-wide" style="color:#EDE7D9">
        DESERT <span style="color:#E8B923">STORM</span>
      </h1>
      <div class="h-px mt-5 mx-auto w-40" style="background:linear-gradient(90deg,#3b82f6,#E8B923,#ef4444)"></div>
      <div class="mt-4 flex items-center justify-center gap-2">
        <span class="inline-flex items-center px-3 py-1 rounded-full bg-white/5 border border-white/10 text-xs text-gray-300">Ho3s Alliance</span>
        <span id="connBadge" class="inline-flex items-center gap-1 px-2 py-1 rounded-full text-[10px] text-gray-500">● checking...</span>
      </div>
    </div>

    <!-- Tabs -->
    <div class="flex justify-center gap-8 mb-6 border-b border-white/10">
      <button id="tabRegisterBtn" data-tab="register" class="tab-btn active pb-3 px-1 font-display text-sm tracking-widest uppercase">Register</button>
      <button id="tabAdminBtn" data-tab="admin" class="tab-btn pb-3 px-1 font-display text-sm tracking-widest uppercase">🛡 Admin</button>
    </div>

    <!-- Registration tab -->
    <div id="tabRegister">
    <div class="rounded-2xl p-6 mb-6 border border-white/10" style="background:#141316">
      <div class="flex items-center gap-2 mb-5">
        <span style="color:#ef4444">◆</span>
        <h2 class="font-display text-lg" style="color:#EDE7D9">Register your entry</h2>
      </div>

      <label class="block text-sm text-gray-400 mb-2">Player name</label>
      <input id="fName" placeholder="Your in-game name"
        class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white mb-4 outline-none focus:border-yellow-500/60" />

      <label class="block text-sm text-gray-400 mb-2">Team</label>
      <div class="grid grid-cols-2 gap-3 mb-4">
        <button type="button" data-team="A" class="team-btn py-3 rounded-xl font-medium border bg-black/30 border-white/10 text-gray-300">Team A</button>
        <button type="button" data-team="B" class="team-btn py-3 rounded-xl font-medium border bg-black/30 border-white/10 text-gray-300">Team B</button>
      </div>

      <label class="block text-sm text-gray-400 mb-2">Troop power</label>
      <input id="fPower" placeholder="e.g. 54M or 1.2B"
        class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white mb-4 outline-none focus:border-yellow-500/60" />

      <label class="block text-sm text-gray-400 mb-2">Troop type</label>
      <select id="fType" class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white mb-4 outline-none focus:border-yellow-500/60">
        <option value="" disabled selected>Select type</option>
        <option value="Aircraft">Aircraft</option>
        <option value="Tanks">Tanks</option>
        <option value="Missiles">Missiles</option>
      </select>

      <p id="formError" class="text-red-400 text-sm mb-3 hidden"></p>
      <p id="formSuccess" class="text-green-400 text-sm mb-3 hidden">✓ Registered! You can submit again anytime to update your entry.</p>

      <button id="registerBtn" class="w-full py-3 rounded-xl font-semibold text-white" style="background:linear-gradient(90deg,#ef4444,#a855f7)">
        Register
      </button>
    </div>
    </div>
    <!-- /Registration tab -->

    <!-- Admin tab -->
    <div id="tabAdmin" class="hidden">
      <div class="rounded-2xl p-5 border border-white/10 text-left" style="background:#141316">

        <div id="pinGate">
          <div class="flex items-center gap-2 mb-4">
            <span style="color:#E8B923">🛡</span>
            <h2 class="font-display text-lg" style="color:#EDE7D9">Admin login</h2>
          </div>
          <div class="flex gap-2">
            <input id="pinInput" type="password" placeholder="PIN"
              class="flex-1 bg-black/40 border border-white/10 rounded-lg px-3 py-2 text-white outline-none focus:border-yellow-500/60" />
            <button id="pinBtn" class="px-4 rounded-lg font-semibold text-black" style="background:#E8B923">🔒 Log in</button>
          </div>
          <p id="pinError" class="text-red-400 text-xs mt-2 hidden">Incorrect PIN.</p>
        </div>

        <div id="adminContent" class="hidden space-y-5">
          <div class="flex items-center justify-between">
            <span class="text-xs uppercase tracking-widest text-gray-400">🛡 Admin dashboard</span>
            <button id="logoutAdminBtn" class="text-gray-500 hover:text-gray-300 text-xs">Log out</button>
          </div>
          <div>
            <label class="block text-xs uppercase tracking-widest text-gray-400 mb-2">Week date</label>
            <div class="flex gap-2">
              <input id="weekDate" type="date" class="flex-1 bg-black/40 border border-white/10 rounded-lg px-3 py-2 text-white outline-none focus:border-yellow-500/60" />
              <button id="saveWeekBtn" class="px-4 rounded-lg font-semibold text-black" style="background:#E8B923">Save</button>
            </div>
          </div>

          <div>
            <label class="block text-xs uppercase tracking-widest text-gray-400 mb-2">Add manually</label>
            <input id="mName" placeholder="Name" class="w-full bg-black/40 border border-white/10 rounded-lg px-3 py-2 text-white text-sm mb-2 outline-none focus:border-yellow-500/60" />
            <div class="grid grid-cols-2 gap-2 mb-2">
              <button type="button" data-mteam="A" class="mteam-btn py-2 rounded-lg text-sm border bg-black/30 border-white/10 text-gray-300">Team A</button>
              <button type="button" data-mteam="B" class="mteam-btn py-2 rounded-lg text-sm border bg-black/30 border-white/10 text-gray-300">Team B</button>
            </div>
            <select id="mType" class="w-full bg-black/40 border border-white/10 rounded-lg px-3 py-2 text-white text-sm mb-2 outline-none focus:border-yellow-500/60">
              <option value="" disabled selected>Select type</option>
              <option value="Aircraft">Aircraft</option>
              <option value="Tanks">Tanks</option>
              <option value="Missiles">Missiles</option>
            </select>
            <div class="flex gap-2">
              <input id="mPower" placeholder="e.g. 54M" class="flex-1 bg-black/40 border border-white/10 rounded-lg px-3 py-2 text-white text-sm outline-none focus:border-yellow-500/60" />
              <button id="mAddBtn" class="px-4 rounded-lg font-semibold text-black" style="background:#E8B923">Add</button>
            </div>
            <p id="mError" class="text-red-400 text-xs mt-1 hidden"></p>
          </div>

          <div class="pt-2 border-t border-white/10">
            <div class="flex items-center justify-between mb-3 mt-4">
              <h3 class="font-display text-sm" style="color:#EDE7D9">Roster &amp; ranking</h3>
              <button id="exportBtn" class="text-gray-400 hidden">⬇</button>
            </div>

            <div class="grid grid-cols-2 gap-2 mb-3">
              <div class="rounded-lg border border-red-500/50 bg-red-950/20 py-2 text-center">
                <p class="text-[10px] uppercase tracking-widest text-red-300/80">Team A</p>
                <p id="countA" class="text-lg font-bold text-white">0</p>
              </div>
              <div class="rounded-lg border border-blue-400/50 bg-blue-950/20 py-2 text-center">
                <p class="text-[10px] uppercase tracking-widest text-blue-300/80">Team B</p>
                <p id="countB" class="text-lg font-bold text-white">0</p>
              </div>
            </div>

            <div class="flex gap-2 mb-3">
              <button data-filter="all" class="filter-btn px-3 py-1 rounded-full text-xs font-medium border bg-white/10 border-white/30 text-white">All</button>
              <button data-filter="A" class="filter-btn px-3 py-1 rounded-full text-xs font-medium border border-white/10 text-gray-400">Team A</button>
              <button data-filter="B" class="filter-btn px-3 py-1 rounded-full text-xs font-medium border border-white/10 text-gray-400">Team B</button>
            </div>

            <div class="overflow-x-auto -mx-1">
              <table class="roster-table w-full text-xs border-collapse">
                <thead>
                  <tr class="text-[10px] uppercase tracking-widest text-gray-500 border-b border-white/10">
                    <th class="text-left py-2 pr-2">#</th>
                    <th class="text-left py-2 pr-2">Name</th>
                    <th class="text-left py-2 pr-2">Team</th>
                    <th class="text-left py-2 pr-2">Type</th>
                    <th class="text-right py-2 pr-2">Power</th>
                    <th class="py-2"></th>
                  </tr>
                </thead>
                <tbody id="rosterTableBody"></tbody>
              </table>
            </div>
          </div>

          <div id="resetSection">
            <button id="resetBtn" class="w-full py-3 rounded-xl font-bold border border-red-500/60 text-red-400 bg-red-950/20">
              Reset for next week
            </button>
          </div>

          <div>
            <button id="historyToggle" class="text-xs text-gray-400 underline">View week history</button>
            <div id="historyList" class="mt-2 space-y-1 hidden"></div>
          </div>
        </div>
      </div>
    </div>
    <!-- /Admin tab -->

  </div>
</div>

<script>
  // Your Ho3s Alliance Firebase project — same one used by the other apps.
  const firebaseConfig = {
    apiKey: "AIzaSyDVEYlOdV64jD3-asVuLoSmi4KZ_O1KlRE",
    authDomain: "desert-storm-ho3s.firebaseapp.com",
    databaseURL: "https://desert-storm-ho3s-default-rtdb.firebaseio.com",
    projectId: "desert-storm-ho3s",
    storageBucket: "desert-storm-ho3s.firebasestorage.app",
    messagingSenderId: "92441567190",
    appId: "1:92441567190:web:794ef2ad5313fb36200e77"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  // Everything for this tool lives under this root node, so it doesn't
  // collide with data from your other apps (mapa, briefing, transfer-1236, etc).
  const ROOT = "troopRegistration";
  const ADMIN_PIN = "2026";

  function slugify(name) {
    const base = name.trim().toLowerCase().normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
    return base || ("p-" + Date.now());
  }
  function parsePower(raw) {
    if (!raw) return 0;
    let s = String(raw).trim().toUpperCase().replace(",", ".");
    let mult = 1;
    const last = s.slice(-1);
    if (last === "K") { mult = 1e3; s = s.slice(0, -1); }
    else if (last === "M") { mult = 1e6; s = s.slice(0, -1); }
    else if (last === "B") { mult = 1e9; s = s.slice(0, -1); }
    const n = parseFloat(s);
    return isNaN(n) ? 0 : n * mult;
  }
  function formatDate(iso) {
    if (!iso) return "";
    const parts = iso.split("-");
    return parts[2] + "/" + parts[1] + "/" + parts[0];
  }
  function currentMonday() {
    const d = new Date();
    const day = d.getDay();
    const diff = (day === 0 ? -6 : 1) - day;
    d.setDate(d.getDate() + diff);
    return d.toISOString().slice(0, 10);
  }

  // --- connection badge ---
  db.ref(".info/connected").on("value", (snap) => {
    const el = document.getElementById("connBadge");
    if (snap.val()) { el.textContent = "🟢 Live"; el.className = "inline-flex items-center gap-1 px-2 py-1 rounded-full text-[10px] text-green-400"; }
    else { el.textContent = "🔴 Offline"; el.className = "inline-flex items-center gap-1 px-2 py-1 rounded-full text-[10px] text-red-400"; }
  });

  // --- registration form ---
  let selectedTeam = null;
  document.querySelectorAll(".team-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      selectedTeam = btn.dataset.team;
      document.querySelectorAll(".team-btn").forEach((b) => {
        const active = b.dataset.team === selectedTeam;
        const isA = b.dataset.team === "A";
        b.className = "team-btn py-3 rounded-xl font-medium border " + (active
          ? (isA ? "bg-red-950/60 border-red-500 text-red-300" : "bg-blue-950/60 border-blue-400 text-blue-300")
          : "bg-black/30 border-white/10 text-gray-300");
      });
    });
  });

  function showFormError(msg) {
    const el = document.getElementById("formError");
    el.textContent = msg; el.classList.remove("hidden");
    document.getElementById("formSuccess").classList.add("hidden");
  }

  document.getElementById("registerBtn").addEventListener("click", async () => {
    const nameEl = document.getElementById("fName");
    const powerEl = document.getElementById("fPower");
    const typeEl = document.getElementById("fType");
    document.getElementById("formError").classList.add("hidden");
    document.getElementById("formSuccess").classList.add("hidden");

    const name = nameEl.value.trim();
    const power = powerEl.value.trim();
    const type = typeEl.value;

    if (!name) return showFormError("Enter your name.");
    if (!selectedTeam) return showFormError("Choose Team A or Team B.");
    if (!power || parsePower(power) <= 0) return showFormError("Invalid troop power. Use formats like 54M or 1.2B.");
    if (!type) return showFormError("Choose a troop type.");

    const btn = document.getElementById("registerBtn");
    btn.disabled = true; btn.textContent = "Saving...";
    try {
      await db.ref(ROOT + "/players/" + slugify(name)).set({ name, team: selectedTeam, power, type, ts: Date.now() });
      document.getElementById("formSuccess").classList.remove("hidden");
      nameEl.value = ""; powerEl.value = ""; typeEl.value = "";
      selectedTeam = null;
      document.querySelectorAll(".team-btn").forEach((b) => { b.className = "team-btn py-3 rounded-xl font-medium border bg-black/30 border-white/10 text-gray-300"; });
    } catch (e) {
      showFormError("Couldn't save — check your connection and try again.");
    }
    btn.disabled = false; btn.textContent = "Register";
  });

  // --- tabs ---
  function setActiveTab(tab) {
    document.getElementById("tabRegister").classList.toggle("hidden", tab !== "register");
    document.getElementById("tabAdmin").classList.toggle("hidden", tab !== "admin");
    document.getElementById("tabRegisterBtn").classList.toggle("active", tab === "register");
    document.getElementById("tabAdminBtn").classList.toggle("active", tab === "admin");
  }
  document.getElementById("tabRegisterBtn").addEventListener("click", () => setActiveTab("register"));
  document.getElementById("tabAdminBtn").addEventListener("click", () => setActiveTab("admin"));

  // --- admin area ---
  document.getElementById("logoutAdminBtn").addEventListener("click", () => {
    document.getElementById("adminContent").classList.add("hidden");
    document.getElementById("pinGate").classList.remove("hidden");
    document.getElementById("pinInput").value = "";
    if (rosterRef) { rosterRef.off(); rosterRef = null; }
    setActiveTab("register");
  });

  let rosterRef = null;
  let players = [];
  let currentFilter = "all";
  let currentWeek = "";

  document.getElementById("pinBtn").addEventListener("click", () => {
    const val = document.getElementById("pinInput").value;
    if (val === ADMIN_PIN) {
      document.getElementById("pinGate").classList.add("hidden");
      document.getElementById("adminContent").classList.remove("hidden");
      document.getElementById("pinError").classList.add("hidden");
      startAdminSync();
    } else {
      document.getElementById("pinError").classList.remove("hidden");
    }
  });

  function startAdminSync() {
    rosterRef = db.ref(ROOT + "/players");
    rosterRef.on("value", (snap) => {
      const val = snap.val() || {};
      players = Object.values(val);
      renderRoster();
    });

    db.ref(ROOT + "/week").once("value").then((snap) => {
      const w = snap.val();
      if (w && w.date) { currentWeek = w.date; document.getElementById("weekDate").value = w.date; }
      else {
        const today = currentMonday();
        currentWeek = today;
        document.getElementById("weekDate").value = today;
        db.ref(ROOT + "/week").set({ date: today });
      }
    });
  }

  document.querySelectorAll(".filter-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      currentFilter = btn.dataset.filter;
      document.querySelectorAll(".filter-btn").forEach((b) => {
        const active = b.dataset.filter === currentFilter;
        b.className = "filter-btn px-3 py-1 rounded-full text-xs font-medium border " + (active ? "bg-white/10 border-white/30 text-white" : "border-white/10 text-gray-400");
      });
      renderRoster();
    });
  });

  function renderRoster() {
    const sorted = [...players].sort((a, b) => parsePower(b.power) - parsePower(a.power));
    const filtered = sorted.filter((p) => currentFilter === "all" || p.team === currentFilter);
    const maxPower = sorted.length ? parsePower(sorted[0].power) : 1;
    const countA = players.filter((p) => p.team === "A").length;
    const countB = players.filter((p) => p.team === "B").length;

    document.getElementById("countA").textContent = countA;
    document.getElementById("countB").textContent = countB;
    document.getElementById("exportBtn").classList.toggle("hidden", players.length === 0);

    const tbody = document.getElementById("rosterTableBody");
    if (filtered.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" class="text-center text-gray-500 text-xs py-4">No players registered yet.</td></tr>';
      return;
    }
    tbody.innerHTML = filtered.map((p, i) => {
      const badgeClass = p.team === "A" ? "bg-red-950/60 text-red-300" : "bg-blue-950/60 text-blue-300";
      return (
        '<tr class="border-b border-white/5">' +
          '<td class="py-2 pr-2 font-bold" style="color:#E8B923">' + (i + 1) + '</td>' +
          '<td class="py-2 pr-2 text-white font-medium">' + escapeHtml(p.name) + '</td>' +
          '<td class="py-2 pr-2"><span class="text-[9px] font-bold px-1.5 py-0.5 rounded-full ' + badgeClass + '">' + p.team + '</span></td>' +
          '<td class="py-2 pr-2 text-gray-400">' + escapeHtml(p.type || "-") + '</td>' +
          '<td class="py-2 pr-2 text-white font-bold text-right">' + escapeHtml(p.power) + '</td>' +
          '<td class="py-2 text-right"><button class="remove-btn text-gray-600 hover:text-red-400" data-name="' + escapeHtml(p.name) + '">✕</button></td>' +
        '</tr>'
      );
    }).join("");

    tbody.querySelectorAll(".remove-btn").forEach((btn) => {
      btn.addEventListener("click", async () => {
        await db.ref(ROOT + "/players/" + slugify(btn.dataset.name)).remove();
      });
    });
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  // manual add
  let manualTeam = null;
  document.querySelectorAll(".mteam-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      manualTeam = btn.dataset.mteam;
      document.querySelectorAll(".mteam-btn").forEach((b) => {
        const active = b.dataset.mteam === manualTeam;
        const isA = b.dataset.mteam === "A";
        b.className = "mteam-btn py-2 rounded-lg text-sm border " + (active
          ? (isA ? "bg-red-950/60 border-red-500 text-red-300" : "bg-blue-950/60 border-blue-400 text-blue-300")
          : "bg-black/30 border-white/10 text-gray-300");
      });
    });
  });

  document.getElementById("mAddBtn").addEventListener("click", async () => {
    const name = document.getElementById("mName").value.trim();
    const power = document.getElementById("mPower").value.trim();
    const type = document.getElementById("mType").value;
    const errEl = document.getElementById("mError");
    if (!name || !manualTeam || !power || parsePower(power) <= 0 || !type) {
      errEl.textContent = "Fill in name, team, troop type and a valid power.";
      errEl.classList.remove("hidden");
      return;
    }
    errEl.classList.add("hidden");
    await db.ref(ROOT + "/players/" + slugify(name)).set({ name, team: manualTeam, power, type, ts: Date.now() });
    document.getElementById("mName").value = "";
    document.getElementById("mPower").value = "";
    document.getElementById("mType").value = "";
    manualTeam = null;
    document.querySelectorAll(".mteam-btn").forEach((b) => { b.className = "mteam-btn py-2 rounded-lg text-sm border bg-black/30 border-white/10 text-gray-300"; });
  });

  // week date
  document.getElementById("saveWeekBtn").addEventListener("click", async () => {
    const val = document.getElementById("weekDate").value;
    if (!val) return;
    await db.ref(ROOT + "/week").set({ date: val });
    currentWeek = val;
  });

  // export excel
  document.getElementById("exportBtn").addEventListener("click", () => {
    const sorted = [...players].sort((a, b) => parsePower(b.power) - parsePower(a.power));
    const rows = sorted.map((p, i) => ({ Rank: i + 1, Name: p.name, Team: p.team === "A" ? "Team A" : "Team B", "Troop Type": p.type || "", "Troop Power": p.power }));
    const ws = XLSX.utils.json_to_sheet(rows);
    const headers = ["Rank", "Name", "Team", "Troop Type", "Troop Power"];
    ws["!cols"] = headers.map((key) => {
      const maxLen = Math.max(key.length, ...rows.map((r) => String(r[key] ?? "").length));
      return { wch: maxLen + 2 };
    });
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Ranking");
    XLSX.writeFile(wb, "desert-storm-" + (currentWeek || "ranking") + ".xlsx");
  });

  // reset
  function attachResetButtonListener() {
    const btn = document.getElementById("resetBtn");
    if (btn) btn.addEventListener("click", showResetConfirm);
  }

  function showResetConfirm() {
    const section = document.getElementById("resetSection");
    section.innerHTML =
      '<div class="rounded-xl border border-red-500/60 bg-red-950/30 p-4">' +
        '<p class="text-sm text-red-200 mb-3">This will archive the current roster (' + players.length + ' players) and clear all entries for everyone. Confirm?</p>' +
        '<div class="flex gap-2">' +
          '<button id="confirmResetBtn" class="flex-1 py-2 rounded-lg font-bold text-black" style="background:#E8B923">Confirm reset</button>' +
          '<button id="cancelResetBtn" class="flex-1 py-2 rounded-lg font-medium border border-white/20 text-gray-300">Cancel</button>' +
        '</div>' +
      '</div>';
    document.getElementById("cancelResetBtn").addEventListener("click", restoreResetButton);
    document.getElementById("confirmResetBtn").addEventListener("click", doReset);
  }

  function restoreResetButton() {
    const section = document.getElementById("resetSection");
    section.innerHTML = '<button id="resetBtn" class="w-full py-3 rounded-xl font-bold border border-red-500/60 text-red-400 bg-red-950/20">Reset for next week</button>';
    attachResetButtonListener();
  }

  async function doReset() {
    const btn = document.getElementById("confirmResetBtn");
    btn.disabled = true; btn.textContent = "Resetting...";
    if (players.length > 0) {
      const idxSnap = await db.ref(ROOT + "/archiveIndex").once("value");
      const idx = idxSnap.val() || [];
      if (!idx.includes(currentWeek)) idx.push(currentWeek);
      await db.ref(ROOT + "/archiveIndex").set(idx);
      const playersObj = {};
      players.forEach((p) => { playersObj[slugify(p.name)] = p; });
      await db.ref(ROOT + "/archive/" + currentWeek).set({ date: currentWeek, players: playersObj });
    }
    await db.ref(ROOT + "/players").remove();
    const today = currentMonday();
    await db.ref(ROOT + "/week").set({ date: today });
    currentWeek = today;
    document.getElementById("weekDate").value = today;
    restoreResetButton();
  }

  attachResetButtonListener();

  // history
  document.getElementById("historyToggle").addEventListener("click", async () => {
    const box = document.getElementById("historyList");
    if (!box.classList.contains("hidden")) {
      box.classList.add("hidden");
      document.getElementById("historyToggle").textContent = "View week history";
      return;
    }
    const idxSnap = await db.ref(ROOT + "/archiveIndex").once("value");
    const idx = idxSnap.val() || [];
    const entries = [];
    for (const d of idx) {
      const aSnap = await db.ref(ROOT + "/archive/" + d).once("value");
      const a = aSnap.val();
      if (a) entries.push({ date: d, count: Object.keys(a.players || {}).length });
    }
    entries.sort((a, b) => (a.date < b.date ? 1 : -1));
    box.innerHTML = entries.length === 0
      ? '<p class="text-xs text-gray-600">No history yet.</p>'
      : entries.map((h) => '<div class="flex justify-between text-xs text-gray-400 border-b border-white/5 py-1"><span>' + formatDate(h.date) + '</span><span>' + h.count + ' players</span></div>').join("");
    box.classList.remove("hidden");
    document.getElementById("historyToggle").textContent = "Hide history";
  });
</script>
</body>
</html>
