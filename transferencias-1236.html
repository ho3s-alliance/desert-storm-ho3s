function applyLang(lang){
  currentLang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{

// ---------- tabs ----------
document.querySelectorAll(".tab").forEach(t=>{
  t.addEventListener("click", ()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));
    t.classList.add("active");

  });

// ---------- troop selection ----------
const selectedTroops = new Set();
document.querySelectorAll(".troop-card").forEach(card=>{
  card.addEventListener("click", ()=>{
    const t = card.dataset.troop;
    if(selectedTroops.has(t)){ selectedTroops.delete(t); card.classList.remove("selected"); }
    else { selectedTroops.add(t); card.classList.add("selected"); }
  });
});

// ---------- submit ----------
// ---------- shorthand number parsing (1k / 1M / 1G) ----------
function parseShorthand(str){
  if(!str) return 0;
  const clean = str.trim().toLowerCase().replace(",", ".");
  const match = clean.match(/^(\d+(\.\d+)?)\s*(k|m|g|b)?$/);
  if(!match) return Number(clean.replace(/[^\d.]/g, "")) || 0;
  let num = parseFloat(match[1]);
  const suffix = match[3];
  if(suffix === "k") num *= 1e3;
  else if(suffix === "m") num *= 1e6;
  else if(suffix === "g" || suffix === "b") num *= 1e9;
  return Math.round(num);
}

document.getElementById("btnSubmit").addEventListener("click", ()=>{
  const name = document.getElementById("inpName").value.trim();
  const server = document.getElementById("inpServer").value.trim();
  const powerRaw = document.getElementById("inpPower").value.trim();
  const troop1Raw = document.getElementById("inpTroop1").value.trim();
  const killsRaw = document.getElementById("inpKills").value.trim();
  const msgEl = document.getElementById("formMsg");

  if(!name || !server || !powerRaw || selectedTroops.size === 0){
    msgEl.className = "msg err";
    msgEl.textContent = i18n[currentLang].errFields;
    return;
  }

  const entry = {
    name, server, power: parseShorthand(powerRaw), troop1Power: parseShorthand(troop1Raw),
    kills: parseShorthand(killsRaw),
    troops: Array.from(selectedTroops),
    submittedAt: Date.now()
  };

  ref.push(entry).then(()=>{
    msgEl.className = "msg ok";
    msgEl.textContent = i18n[currentLang].okMsg;
    document.getElementById("inpName").value = "";
    document.getElementById("inpServer").value = "";
    document.getElementById("inpPower").value = "";
    document.getElementById("inpTroop1").value = "";
    document.getElementById("inpKills").value = "";
    selectedTroops.clear();
    document.querySelectorAll(".troop-card").forEach(c=>c.classList.remove("selected"));
  }).catch(err=>{
    msgEl.className = "msg err";
    msgEl.textContent = err.message;
  });
});

    document.getElementById("adminView").style.display = "block";
    startAdminListener();
  } else {
    const m = document.getElementById("pinMsg");
    m.className = "msg err";
    m.textContent = i18n[currentLang].errPin;
  }
}

// ---------- admin data ----------
let lastData = {};
let adminListenerStarted = false;
function startAdminListener(){
  if(adminListenerStarted) return;
  adminListenerStarted = true;
  ref.on("value", snap=>{
    lastData = snap.val() || {};
    renderTable(lastData);
  });
}
const troopIcons = {
  tanks:'<svg viewBox="0 0 24 24"><path d="M7 8h6l2 2h6v2h-1.2l-.5 2H21v2H3v-2h1.7l-.5-2H3v-2h6l1-1V6h2v2zM5.8 12l.5 2h11.4l.5-2H5.8z"/><circle cx="6" cy="18.5" r="1.7"/><circle cx="12" cy="18.5" r="1.7"/><circle cx="18" cy="18.5" r="1.7"/></svg>',
  missiles:'<svg viewBox="0 0 24 24"><path d="M2 15h9v3.5c0 .8-.7 1.5-1.5 1.5H4a2 2 0 01-2-2v-3z"/><circle cx="5" cy="20.5" r="1.5"/><circle cx="9.5" cy="20.5" r="1.5"/><g transform="rotate(-38 12 11)"><rect x="10.5" y="3" width="3" height="12" rx="1.3"/><polygon points="10.5,3 13.5,3 12,0.3"/><polygon points="10.2,14 13.8,14 13.2,16.5 10.8,16.5"/></g></svg>',
  aircraft:'<svg viewBox="0 0 24 24"><path d="M12 2c.6 0 1 .5 1 1.2v5.4l7 4.2v1.8l-7-2V17l2.3 1.7v1.5L12 19l-3.3 1.2v-1.5L11 17v-4.4l-7 2v-1.8l7-4.2V3.2C11 2.5 11.4 2 12 2z"/></svg>'
};
function renderTable(data){
  const tbody = document.getElementById("tblBody");
  const empty = document.getElementById("emptyState");
  const countNum = document.getElementById("countNum");
  if(!tbody) return;
  tbody.innerHTML = "";
  const keys = Object.keys(data);
  countNum.textContent = keys.length;
  empty.style.display = keys.length === 0 ? "block" : "none";
  keys.sort((a,b)=> (data[b].submittedAt||0) - (data[a].submittedAt||0));
  keys.forEach(key=>{
    const e = data[key];
    const tr = document.createElement("tr");
    const troopLabels = (e.troops||[]).map(t=>{
      const label = i18n[currentLang]["troop"+t.charAt(0).toUpperCase()+t.slice(1)] || t;
      return `<span class="troop-pill">${troopIcons[t]||""}${label}</span>`;
    }).join(" ");
    tr.innerHTML = `
      <td>${escapeHtml(e.name||"")}</td>
      <td>${escapeHtml(e.server||"")}</td>
      <td class="power-val">${formatShorthand(e.power)}</td>
      <td>${formatShorthand(e.troop1Power)}</td>
      <td>${troopLabels}</td>
      <td>${formatShorthand(e.kills)}</td>
      <td><button class="del-btn" data-key="${key}">✕</button></td>
    `;
    tbody.appendChild(tr);
  });
  tbody.querySelectorAll(".del-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(confirm(i18n[currentLang].confirmDel)){
        ref.child(btn.dataset.key).remove();
      }
    });
  });
}
function escapeHtml(str){
  const d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}
function formatShorthand(num){
  num = Number(num) || 0;
  if(num >= 1e9) return (num/1e9).toFixed(num % 1e9 === 0 ? 0 : 2).replace(/\.00$/,"") + "G";
  if(num >= 1e6) return (num/1e6).toFixed(num % 1e6 === 0 ? 0 : 2).replace(/\.00$/,"") + "M";
  if(num >= 1e3) return (num/1e3).toFixed(num % 1e3 === 0 ? 0 : 2).replace(/\.00$/,"") + "k";
  return String(num);
}

// ---------- excel export ----------
document.getElementById("btnExport").addEventListener("click", ()=>{
  const rows = Object.values(lastData).map(e=>({
    Name: e.name,
    "Current Server": e.server,
    "Hero Power": e.power,
    "First Squad Power": e.troop1Power,
    Troops: (e.troops||[]).join(", "),
    Kills: e.kills,
    "Submitted At": e.submittedAt ? new Date(e.submittedAt).toLocaleString() : ""
  }));
  if(rows.length === 0) return;
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Server 1236");
  XLSX.writeFile(wb, "server-1236-transfers.xlsx");
});

applyLang("pt");
</script>
